<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Ilustração de uma fonoaudióloga atendendo uma criança">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFD3BA"/>
      <stop offset="1" stop-color="#D9A37F"/>
    </linearGradient>
    <linearGradient id="tbl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A55D49"/>
      <stop offset="1" stop-color="#7A4031"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#wall)"/>

  <!-- janela em arco com luz -->
  <path d="M470 560V250a130 130 0 0 1 260 0v310z" fill="#F7EEE3"/>
  <path d="M600 120v440M470 340h260" stroke="#E5C9AE" stroke-width="8"/>
  <circle cx="660" cy="200" r="46" fill="#F6D9A6" opacity=".7"/>

  <!-- prateleira com plantinha -->
  <rect x="60" y="300" width="240" height="14" rx="7" fill="#8A4B3A"/>
  <path d="M130 300c-10-50 8-86 34-100 6 36-6 76-34 100zM170 300c14-40 40-62 70-66-4 36-30 62-70 66z" fill="#7C8B6F"/>
  <rect x="140" y="282" width="52" height="20" rx="6" fill="#C4572E"/>
  <rect x="226" y="262" width="34" height="38" rx="6" fill="#B8893B"/>

  <!-- fonoaudióloga -->
  <rect x="222" y="470" width="36" height="50" rx="14" fill="#E8B896"/>
  <rect x="150" y="500" width="190" height="260" rx="70" fill="#C4572E"/>
  <circle cx="240" cy="418" r="64" fill="#EDBE9C"/>
  <path d="M176 418c-6-62 36-92 80-86 40 6 56 40 48 80-14-34-44-50-78-46-26 2-44 20-50 52z" fill="#2A1F1A"/>
  <circle cx="212" cy="344" r="30" fill="#2A1F1A"/>
  <circle cx="266" cy="424" r="4" fill="#2A1F1A"/>
  <circle cx="292" cy="424" r="4" fill="#2A1F1A"/>
  <path d="M268 450q14 12 28 0" stroke="#8A4B3A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- braço estendido segurando o cartão -->
  <path d="M312 560L420 650" stroke="#C4572E" stroke-width="40" stroke-linecap="round"/>
  <circle cx="432" cy="660" r="22" fill="#EDBE9C"/>

  <!-- criança -->
  <rect x="520" y="545" width="30" height="40" rx="12" fill="#F0C4A3"/>
  <rect x="480" y="570" width="160" height="200" rx="60" fill="#7C8B6F"/>
  <circle cx="560" cy="500" r="54" fill="#F3CBAB"/>
  <path d="M506 498c-4-46 28-66 62-60 30 6 44 32 40 62-12-26-34-36-60-32-20 2-34 12-42 30z" fill="#5A3A2A"/>
  <circle cx="540" cy="506" r="4" fill="#2A1F1A"/>
  <circle cx="568" cy="506" r="4" fill="#2A1F1A"/>
  <ellipse cx="536" cy="530" rx="9" ry="7" fill="#8A4B3A"/>
  <circle cx="586" cy="522" r="9" fill="#E8A58A" opacity=".6"/>

  <!-- ondas de voz da criança até a fono -->
  <g fill="none" stroke="#FAF6F0" stroke-width="6" stroke-linecap="round" opacity=".9">
    <path d="M506 516q-14 14 0 28"/>
    <path d="M488 506q-26 24 0 48" opacity=".7"/>
    <path d="M470 496q-38 34 0 68" opacity=".45"/>
  </g>

  <!-- mesa -->
  <rect x="0" y="720" width="800" height="280" fill="url(#tbl)"/>
  <rect x="0" y="720" width="800" height="16" fill="#C4785F"/>

  <!-- cartão de apoio e brinquedos -->
  <g transform="rotate(-8 430 700)">
    <rect x="388" y="640" width="96" height="112" rx="12" fill="#FAF6F0"/>
    <circle cx="436" cy="682" r="16" fill="#C4572E"/>
    <path d="M404 724h64M412 738h48" stroke="#7C8B6F" stroke-width="5" stroke-linecap="round"/>
  </g>
  <rect x="610" y="684" width="52" height="52" rx="8" fill="#B8893B"/>
  <circle cx="696" cy="710" r="26" fill="#C4572E"/>
  <rect x="660" y="660" width="40" height="40" rx="8" fill="#F4EDE4"/>
  <path d="M240 800h320" stroke="#FAF6F0" stroke-opacity=".18" stroke-width="6" stroke-linecap="round"/>
</svg>
